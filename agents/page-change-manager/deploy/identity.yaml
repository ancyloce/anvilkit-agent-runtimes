# Workload identity and network boundary for the page-change-manager
# Agent Runtime Unit.
#
# The identity is the unit's own — no Page agent shares one, and none shares
# the Agent Service's. A shared identity would make their access
# indistinguishable in an audit, and an audit that cannot attribute access is
# an audit of nothing.
#
# The network boundary is least privilege stated as policy rather than
# convention: the unit answers dispatch from the control plane, asks the
# control plane for its released routes, resolves names, and emits telemetry.
# Everything else — peers, provider endpoints, storage, the other unit — is
# unreachable by construction, matching the manifest's declared
# "deny-all-except-allowed-endpoints" posture.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anvilkit-page-change-manager
  labels:
    app.kubernetes.io/name: page-change-manager
    anvilkit.dev/runtime-unit: page-change-manager
# The unit never speaks to the Kubernetes API; a mounted token would be
# standing credential for an access nothing legitimate performs.
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: page-change-manager
  labels:
    app.kubernetes.io/name: page-change-manager
    anvilkit.dev/runtime-unit: page-change-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: page-change-manager
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the control plane dispatches tasks. Admission still verifies every
    # credential — the network rule is a boundary, not the authentication.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-service
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    # The governed control-plane origin: model invocations and artifact grants
    # are released routes on it, never separate addresses.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-service
      ports:
        - {protocol: TCP, port: 8080}
    # Cluster DNS, to resolve the control-plane origin.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Telemetry export to the collector.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - {protocol: TCP, port: 4318}
